<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музыкальный плеер</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e2f; color: white; text-align: center; padding: 20px; }
        ul { list-style: none; padding: 0; }
        li { margin: 10px; }
        button { background: #ff7f50; border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 5px; }
        button:hover { background: #ff6347; }
        audio { width: 100%; max-width: 500px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>🎵 Музыкальный плеер</h1>
    <audio id="player" controls></audio>
    <h2>Плейлист</h2>
    <ul id="playlist"></ul>

    <script>
        fetch('/playlist.json')
            .then(response => response.json())
            .then(tracks => {
                const player = document.getElementById('player');
                const playlist = document.getElementById('playlist');

                tracks.forEach((track, index) => {
                    const li = document.createElement('li');
                    const btn = document.createElement('button');
                    btn.textContent = track.title;
                    btn.addEventListener('click', () => {
                        player.src = '/proxy?url=' + encodeURIComponent(track.url);
                        player.play();
                    });
                    li.appendChild(btn);
                    playlist.appendChild(li);
                });

                if (tracks.length > 0) {
                    player.src = '/proxy?url=' + encodeURIComponent(tracks[0].url);
                }
            })
            .catch(err => console.error('Ошибка загрузки плейлиста:', err));
    </script>
</body>
</html>
