<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой музыкальный плеер</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e2f; color: white; text-align: center; padding: 20px; }
        ul { list-style: none; padding: 0; }
        li { margin: 10px; }
        button { background: #ff7f50; border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 5px; }
        button:hover { background: #ff6347; }
        audio { width: 100%; max-width: 500px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>🎵 Музыкальный плеер</h1>
    <audio id="player" controls></audio>
    <h2>Плейлист</h2>
    <ul id="playlist"></ul>
    <script>
        // Список треков – просто добавь сюда свои файлы из папки music
        const tracks = [
            { title: "Песня 1", src: "music/song1.mp3" },
            { title: "Песня 2", src: "music/song2.mp3" },
            // Добавляй дальше:
            // { title: "Название", src: "music/файл.mp3" }
        ];

        const player = document.getElementById('player');
        const playlist = document.getElementById('playlist');

        function loadTrack(index) {
            player.src = tracks[index].src;
            player.play();
        }

        tracks.forEach((track, index) => {
            const li = document.createElement('li');
            const btn = document.createElement('button');
            btn.textContent = track.title;
            btn.addEventListener('click', () => loadTrack(index));
            li.appendChild(btn);
            playlist.appendChild(li);
        });

        // Автозагрузка первого трека при открытии страницы
        if (tracks.length > 0) {
            player.src = tracks[0].src;
        }
    </script>
</body>
</html>
